admittance_filter:
  mass: {
    type: double_array,
    description: "Specifies the mass (M_d) values for the translational (x, y, z) and rotational (rx, ry, rz) directions used in the admittance law.",
    validation: {
      fixed_size<>: 6,
      element_bounds<>: [ 0.0001, 10000.0 ]
    }
  }
  damping_ratio: {
    type: double_array,
    description: "Specifies damping ratio (zeta) values for the translational (x, y, z) and rotational (rx, ry, rz) directions used in the admittance law.
    The corresponding damping (K_D) is obtained as: K_D = zeta * (2 * sqrt( M_d * K_P )).",
    validation: {
      fixed_size<>: 6,
      element_bounds<>: [ 0.0, 20.0 ]
    }
  }
  stiffness: {
    type: double_array,
    description: "Specifies the stiffness (K_P) values for the translational (x, y, z) and rotational (rx, ry, rz) directions used in the admittance law.",
    validation: {
      fixed_size<>: 6,
      element_bounds<>: [ 0.0, 1000000.0 ]
    }
  }
  order: {
    type: int,
    description: "Specifies the order of the admittance filter in the set {0, 1, 2}.",
    validation: {
      bounds<>: [ 0, 2 ]
    }
  }
  compliant_axis: {
    type: bool_array,
    description: "Specifies the axes to be used in the admittance filter. The axes are defined as follows:
    x, y, z, rx, ry, rz",
    validation: {
      fixed_size<>: 6
    }
  }
